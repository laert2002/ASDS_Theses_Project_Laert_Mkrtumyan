# Central settings shared by all scripts in src/.
# Change values here instead of editing the scripts.

models:
  small: meta-llama/Llama-3.2-1B   # used for all experiments that load weights
  large: meta-llama/Llama-3.1-8B   # used for config comparison (Task 4); ~16 GB in fp16

dtype: float16        # float16 | bfloat16 | float32
device: cuda          # falls back to cpu (with float32) if CUDA is not available
seed: 0

prompt: "The capital of France is"
max_new_tokens: 20

# Input lengths for the "how does attention grow with T" experiment (Task 5)
attention_growth_lengths: [16, 64, 256, 512]
